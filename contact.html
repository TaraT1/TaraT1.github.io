    <!-- This is a working contact form using web3forms.com. To receive email, Replace YOUR_ACCESS_KEY_HERE with your actual Access Key.  Create Access Key here 👉 https://web3forms.com/ --> <section class="contact-section"> <div class="contact-intro"> <h2 class="contact-title">Get in Touch</h2>
        <p class="contact-description">
        To connect, fill out the form below.
        </p>
    </div>

    <form class="contact-form" action="https://api.web3forms.com/submit" method="POST">

        <input type="hidden" name="access_key" value="30d99832-4d06-4a58-afa1-81f4b92567a8" />
        <input type="hidden" name="subject" value="New Contact Form Submission from Web3Forms" />
        <input type="hidden" name="from_name" value="tt.com" />
        <!-- More custom ization options available in the docs: https://docs.web3forms.com -->

        <div class="form-group-container">
        <div class="form-group">
            <label for="name" class="form-label">Name</label>
            <input id="name" name="name" class="form-input" placeholder="Your name" type="text" />
        </div>
        <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input id="email" name="email" class="form-input" placeholder="Your email" type="email" />
        </div>
        <div class="form-group">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-textarea" id="message" name="message" placeholder="Your message"></textarea>
        </div>
        </div>
        <button class="form-submit" type="submit">Send Message</button>
    </form>
